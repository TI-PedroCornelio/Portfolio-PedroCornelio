<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="author" content="pedro"/>
		<title> Agenda Telefonica </title>

		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	</head>
	<style>
		*{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Outfit', sans-serif;
		}

		body{
			height: 100vh;
		}

		nav.menu-lateral{
			width: 80px;
			height: 100%;
			background-color: black;
			padding: 40px 0 40px 1%;
			box-shadow: 3px 0 0 #0040FF;

			position: fixed;
			top: 0;
			left: 0;
			overflow: hidden;
			transition: .5s;
		}

		nav.menu-lateral.expandir{
			width: 300px;
		}

		.btn-expandir{
			width: 100%;
			padding-left: 10px;
			margin-bottom: 20px; /* espaço abaixo do botão */
		}

		.btn-expandir > i{
			color: #fff;
			font-size: 30px;
			cursor: pointer;
		}

		ul{
			height: 100%;
			list-style-type: none;
		}

		ul li.item-menu{
			transform: .2s;
		}

		ul li.ativo{
			background-color: #0040FF;
		}

		ul li.item-menu:hover{
			background: #0040FF;
		}

		ul li.item-menu a{
			color: #fff;
			text-decoration: none;
			font-size: 20px;
			padding: 20px 4%;
			display: flex;
			margin-bottom: 1px;
			line-height: 30px;
		}

		ul li.item-menu a .txt-link{
			margin-left: 0px;
			transition: .5s;
			opacity: 0;
		}

		nav.menu-lateral.expandir .txt-link{
			margin-left: 40px;
			opacity: 1;
		}

		ul li.item-menu a .icon > i{
			font-size: 25px;
			margin-left: 10px;
		}

		header{
			background-color: black;
			color: #fff;
			padding: 15px;
		}

		img {
			max-width: 50%;
			height: auto;
			margin: 20px auto 0 auto; /* top, right, bottom, left */
			display: block;
		}

		.container {
			display: flex;
			justify-content: center; /* Centraliza horizontalmente */
			align-items: center;     /* Centraliza verticalmente */
			height: 80vh;           /* Ocupa 100% da altura da tela */
		}

		footer {
            background-color: transparent;
            color: #848484;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
	</style>
	<body>

        <nav class="menu-lateral"> <!--Menu Lateral-->
			
            <div class="btn-expandir"> <!--btn expandir-->
				<i class="bi bi-chevron-double-right" id="btn-exp"></i>
			</div>

			<ul>
				<li class="item-menu ativo">
					<a href="Agenda Telefonica.html">
						<span class="icon"><i class="bi bi-house"></i></span>
						<span class="txt-link">Home</span>
					</a>
				</li>
				<li class="item-menu">
					<a href="Automoveis.html">
						<span class="icon"><i class="bi bi-car-front"></i></i></span>
						<span class="txt-link">Automóveis</span>
					</a>
				</li>
				<li class="item-menu">
					<a href="Caminhoes.html">
						<span class="icon"><i class="bi bi-truck"></i></i></span>
						<span class="txt-link">Caminhões</span>
					</a>
				</li>
				<li class="item-menu">
					<a href="Outros.html">
						<span class="icon"><i class="bi bi-telephone"></i></i></span>
						<span class="txt-link">Outros</span>
					</a>
				</li>
			</ul>

        </nav>

		<script src="Menu JavaScript.js"></script>

		<header>
			<h1 align="right">Empresas Maggi</h1>
		</header>

		<div class="container">
			<img src="Logoempresasmaggi.jpg" alt="Logo Empresas Maggi">
		</div>

		<footer>
			<p>© 2025 Developed by: Pedro Cornélio</p>
		</footer>
	</body>
</html>
